<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>记忆训练系统 V1</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="记忆训练" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="手机优先的记忆训练系统原型：方法学习、基础训练、专项挑战、能力达标和长期巩固。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M18 20h28v24H18z' fill='%23f6c453'/%3E%3Cpath d='M24 14h26v24H24z' fill='%2338bdf8'/%3E%3Cpath d='M16 28h28v18H16z' fill='%23f8fafc'/%3E%3Ccircle cx='24' cy='37' r='4' fill='%23ef4444'/%3E%3Cpath d='M32 34h7v3h-7zm0 6h7v3h-7z' fill='%230b1020'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }

      html {
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      body,
      .app-shell,
      a,
      button,
      [data-tab],
      [data-stage],
      [data-check],
      [data-retry],
      [data-next-level],
      [data-exit-session],
      [data-start-session],
      [data-method-select],
      [data-open-method],
      [data-learn-method] {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      input,
      textarea,
      [contenteditable="true"],
      .recall-input {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <script>
      (() => {
        const isEditable = (target) => Boolean(target?.closest?.("input, textarea, [contenteditable='true']"));
        let lastTouchEnd = 0;

        document.addEventListener("contextmenu", (event) => {
          if (!isEditable(event.target)) event.preventDefault();
        });
        document.addEventListener("selectstart", (event) => {
          if (!isEditable(event.target)) event.preventDefault();
        });
        document.addEventListener("dragstart", (event) => {
          if (!isEditable(event.target)) event.preventDefault();
        });
        document.addEventListener(
          "touchend",
          (event) => {
            const now = Date.now();
            if (now - lastTouchEnd < 320 && !isEditable(event.target)) event.preventDefault();
            lastTouchEnd = now;
          },
          { passive: false },
        );

        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
          });
        }
      })();
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
